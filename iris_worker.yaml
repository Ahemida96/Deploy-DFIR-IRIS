apiVersion: v1
kind: Secret
metadata:
  name: iris-root-ca-cert-secret-app
  labels:
    app: iriswebapp-worker
type: Opaque
data:
  irisRootCACert.pem: 
---
apiVersion: v1
kind: Secret
metadata:
  name: iris-ldap-certs-secret-app
  labels:
    app: iriswebapp-worker
type: Opaque
data:
  ldap-cert-1.pem: ""
  ldap-cert-2.pem: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: iris-certs-dir-rootca-secrets-app
  labels:
    app: iriswebapp-worker
type: Opaque
data:
  irisRootCACert.pem: 
  irisRootCACert.srl: NTIzNjZDNDg1MUQ5MjQ1RDkxQjA3RTI4OEMxOTdGRThEQTk3NkZBOQ0K
  irisRootCAKey.pem: 

---
apiVersion: v1
kind: Secret
metadata:
  name: iris-certs-dir-webcerts-secrets-app
  labels:
    app: iriswebapp-worker
type: Opaque
data:
  iris_dev_cert.pem: 
  iris_dev_key.pem: 
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iriswebapp-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iriswebapp-worker
  template:
    metadata:
      labels:
        app: iriswebapp-worker
    spec:
      securityContext: {}
      containers:
        - name: iriswebapp-worker
          securityContext: {}
          resources: {}
          image: ahemida96/iriswebapp_app
          imagePullPolicy: "IfNotPresent"
          command: ['./wait-for-iriswebapp.sh', "iriswebapp-app:8000", './iris-entrypoint.sh', 'iris-worker']

          env:

          - name: POSTGRES_USER
            value: raptor

          - name:  POSTGRES_PASSWORDD
            value: postgres

          - name:  POSTGRES_ADMIN_USER
            value: raptor

          - name:  POSTGRES_ADMIN_PASSWORD
            value: postgres   

          - name:  POSTGRES_PORT
            value: "5432"

          - name:  POSTGRES_SERVER
            value: postgres.<name_space>.svc.cluster.local

          - name:  IRIS_SECRET_KEY
            value: AVerySuperSecretKey-SoNotThisOne

          - name:  IRIS_SECURITY_PASSWORD_SALT
            value: ARandomSalt-NotThisOneEither

          volumeMounts:
            - mountPath: /home/iris/downloads
              name: iris-downloads
            - mountPath: /home/iris/user_templates
              name: user-templates
            - mountPath: /home/iris/server_data
              name: server-data
            - mountPath: /etc/irisRootCACert.pem
              name: iris-root-ca-cert
              subPath: irisRootCACert.pem
              readOnly: true
            - mountPath: /home/iris/certificates/rootCA
              name: iris-certs-dir-rootca
              readOnly: true
            - mountPath: /home/iris/certificates/web_certificates
              name: iris-certs-dir-webcerts
              readOnly: true
            - mountPath: /iriswebapp/certificates/ldap/
              name: iris-ldap-certs
              readOnly: true
      volumes:
        - name: iris-downloads
          emptyDir: {}  
        - name: user-templates
          emptyDir: {}
        - name: server-data 
          emptyDir: {}
        - name: iris-root-ca-cert
          secret:
            secretName: iris-root-ca-cert-secret-worker
        - name: iris-certs-dir-rootca
          secret:
            secretName: iris-certs-dir-rootca-secrets-worker
        - name: iris-ldap-certs
          secret:
            secretName: iris-ldap-certs-secret-worker
        - name: iris-certs-dir-webcerts
          secret:
            secretName: iris-certs-dir-webcerts-secrets-worker
---
